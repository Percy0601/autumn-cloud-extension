# ==================== 基础配置（三后端互斥，默认组播，零外部依赖） ====================
spring.application.name=autumn-cloud-extension-using

# 后端三选一：consul / nacos / multicast（见 application-consul/nacos.properties）
autumn.discovery.backend=multicast

# ---- 流量标签（网关侧）----
# 传递流量标签的 header（默认即 X-Autumn-Traffic-Label，可自定义）
#autumn.traffic.header-name=X-Autumn-Traffic-Label
# 目标签无实例时是否回落 default 标签（默认 true）
#autumn.traffic.fallback-to-default=true

# ---- 组播参数（后端=multicast 时生效，默认值如下）----
#autumn.discovery.multicast.group=239.192.71.88
#autumn.discovery.multicast.port=47891
#autumn.discovery.multicast.ttl=1
#autumn.discovery.multicast.heartbeat-interval-ms=3000
#autumn.discovery.multicast.evict-after-ms=15000
