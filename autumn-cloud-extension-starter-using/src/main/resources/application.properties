# ==================== 基础配置（默认组播，零外部依赖） ====================
spring.application.name=autumn-cloud-extension-using

# 后端三选一：consul / nacos / multicast（见 application-consul/nacos.properties）
# 示例模块为演示切换引了全部 Starter，因此必须显式指定；只引一个 Starter 时可省略
autumn.discovery.backend=multicast

# ---- 泳道路由（网关侧，前缀 autumn.traffic）----
# 携带泳道标签的 header（默认 X-Traffic）
#autumn.traffic.header=X-Traffic
# 目标标签无实例时是否回落到 default 主干（默认 true，键名保留兼容）
#autumn.traffic.fallback-to-main=true

# ---- 配置中心（可选，必须显式指定 backend 才启用，见 application-config.properties）----
#autumn.config.backend=nacos
#autumn.config.data-id=autumn-cloud-extension-using.properties
#autumn.config.default-group=DEFAULT_GROUP
#autumn.config.refresh-enabled=true

# ---- 组播参数（后端=multicast 时生效，默认值如下）----
#autumn.discovery.multicast.group=239.192.71.88
#autumn.discovery.multicast.port=47891
#autumn.discovery.multicast.ttl=1
#autumn.discovery.multicast.heartbeat-interval-ms=3000
#autumn.discovery.multicast.evict-after-ms=15000
