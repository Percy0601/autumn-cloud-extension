# ==================== Provider：default 流量标签实例 ====================
spring.application.name=demo-service
server.port=8101
# 本实例流量标签（写入注册 metadata["traffic"]）
autumn.discovery.traffic=default

# ==================== 请求头透传（provider 作为链路中间跳） ====================
# 打开后，用 @ImportHttpServices 声明的客户端会把入站 X-Traffic 带给下游
autumn.propagation.enabled=true
# 白名单默认就是 X-Traffic，要带别的再显式列出来
#autumn.propagation.include=X-Traffic,X-Tenant-Id
