# ==================== 配置中心示例 ====================
# 用法：--spring.profiles.active=config,config-nacos 或 config,config-consul
# 注意：不要直接用 config,nacos / config,consul —— 那会连带把"服务发现"也切成对应后端
# 需先在 Nacos/Consul 创建 dataId=config-demo.properties、group=DEFAULT_GROUP，
# 内容为 .properties 格式，例如：demo.config.value=from-remote

server.port=8103
spring.application.name=config-demo

# ---- 配置中心启用 ----
autumn.config.enabled=true
# backend 由 config-nacos / config-consul profile 提供（必须显式指定才启用）
#autumn.config.backend=nacos
# 远程 dataId（默认即 ${spring.application.name}.properties）
autumn.config.data-id=config-demo.properties
# 是否启用配置自动刷新
autumn.config.refresh-enabled=true
# 默认分组
autumn.config.default-group=DEFAULT_GROUP
# 默认命名空间
autumn.config.default-namespace=public

# ---- Nacos 配置中心 ----
autumn.config.nacos.server-addr=127.0.0.1:8848
#autumn.config.nacos.access-token=
#autumn.config.nacos.polling-timeout-ms=30000

# ---- Consul 配置中心（切换到 consul 时启用）----
#autumn.config.consul.host=127.0.0.1
#autumn.config.consul.port=8500
#autumn.config.consul.token=
#autumn.config.consul.datacenter=dc1

# ---- 演示配置项（会被配置中心覆盖）----
demo.config.value=default-from-application-properties
demo.config.timeout=3000
demo.config.feature.enabled=false

# ---- 服务发现（复用 multicast 做演示）----
autumn.discovery.backend=multicast
