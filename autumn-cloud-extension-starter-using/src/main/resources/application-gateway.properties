# ==================== Gateway：lb:// 路由 + 流量标签负载均衡 ====================
spring.application.name=demo-gateway
server.port=8080
# 网关自身不注册
autumn.discovery.register=false

spring.cloud.gateway.server.webflux.routes[0].id=demo-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://demo-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
